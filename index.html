<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADAR — Plataforma de Suporte à Decisão Clínica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F2F5F8;
            --navy-brand: #07213C;
            --clinico-icon: #16A4C4;
            --clinico-text: #104F6E;
            --beers-icon: #157353;
            --beers-text: #0E4D36;
            --onco-icon: #731454;
            --onco-text: #4B0B36;
            --ped-blue: #46ADE0;
            --ped-pink: #F28291;
            --uti-icon: #D9231A;
            --uti-orange: #EA5E11;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 42%, #FFFFFF 0%, #EFF3F7 65%, #E5EBF1 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Malha técnica e linhas vivas nos 4 cantos */
        .hud-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .pulse-path {
            stroke-dasharray: 28 240;
            animation: hudFlow 7s linear infinite;
        }

        .pulse-path-delayed {
            stroke-dasharray: 22 260;
            animation: hudFlow 9s linear infinite reverse;
        }

        @keyframes hudFlow {
            0% { stroke-dashoffset: 280; opacity: 0.25; }
            50% { opacity: 0.85; }
            100% { stroke-dashoffset: 0; opacity: 0.25; }
        }

        /* Animação orgânica e suave dos blocos e partículas no Hover */
        .radar-cell,
        .radar-particle {
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            transform-box: fill-box;
            transform-origin: center;
        }

        .interactive-logo:hover .radar-cell {
            transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(var(--sc, 1.05));
        }

        .interactive-logo:hover .radar-particle {
            transform: translate(var(--px, 0px), var(--py, 0px)) rotate(var(--pr, 12deg)) scale(1.18);
        }

        .center-symbol {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 100px 100px;
        }

        .program-card {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 10px 16px;
            border-radius: 20px;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.35s ease, box-shadow 0.35s ease;
            position: relative;
        }

        .program-card:hover {
            transform: translateY(-6px);
            background-color: rgba(255, 255, 255, 0.65);
            box-shadow: 0 18px 38px -12px rgba(7, 33, 60, 0.09), 0 0 0 1px rgba(255, 255, 255, 0.9);
        }

        .program-card:hover .center-symbol {
            transform: scale(1.07);
        }

        .title-radar {
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.05;
        }

        .subtitle-program {
            font-weight: 800;
            letter-spacing: 0.03em;
            line-height: 1.15;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- FUNDO TÉCNICO ARQUITETÔNICO E CIRCUITOS NOS 4 CANTOS (FIEL À IMAGEM) -->
    <svg class="hud-bg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <defs>
            <linearGradient id="hudPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#16A4C4" stop-opacity="0" />
                <stop offset="50%" stop-color="#16A4C4" stop-opacity="0.75" />
                <stop offset="100%" stop-color="#07213C" stop-opacity="0" />
            </linearGradient>
        </defs>

        <!-- CANTO SUPERIOR ESQUERDO -->
        <g stroke="#CFD8E3" stroke-width="1.3" fill="none">
            <!-- Grade superior esquerda -->
            <line x1="0" y1="65" x2="380" y2="65" />
            <line x1="0" y1="115" x2="380" y2="115" />
            <line x1="0" y1="165" x2="310" y2="165" />
            <line x1="0" y1="215" x2="380" y2="215" />
            <line x1="0" y1="265" x2="290" y2="265" />
            <line x1="55" y1="0" x2="55" y2="330" />
            <line x1="115" y1="0" x2="115" y2="330" />
            <line x1="175" y1="0" x2="175" y2="330" />
            <line x1="235" y1="0" x2="235" y2="290" />
            <line x1="295" y1="55" x2="295" y2="260" />
            <!-- Circuito superior esquerdo -->
            <path d="M 0 355 L 195 355 L 220 380 L 420 380" stroke="#B8C5D4" stroke-width="1.8" />
            <path d="M 0 355 L 195 355 L 220 380 L 420 380" stroke="url(#hudPulseGrad)" stroke-width="2.6" class="pulse-path" />
        </g>

        <!-- CANTO SUPERIOR DIREITO -->
        <g stroke="#CFD8E3" stroke-width="1.3" fill="none">
            <!-- Circuito superior direito -->
            <path d="M 1920 38 L 1710 38 L 1675 72 L 1510 72" stroke="#B8C5D4" stroke-width="1.8" />
            <path d="M 1920 88 L 1690 88 L 1665 112 L 1535 112" />
            <path d="M 1920 38 L 1710 38 L 1675 72 L 1510 72" stroke="url(#hudPulseGrad)" stroke-width="2.6" class="pulse-path-delayed" />
            <!-- Grade direita -->
            <line x1="1685" y1="112" x2="1920" y2="112" />
            <line x1="1685" y1="165" x2="1920" y2="165" />
            <line x1="1685" y1="220" x2="1920" y2="220" />
            <line x1="1685" y1="275" x2="1920" y2="275" />
            <line x1="1685" y1="330" x2="1920" y2="330" />
            <line x1="1685" y1="112" x2="1685" y2="390" />
            <line x1="1730" y1="112" x2="1730" y2="390" />
            <line x1="1775" y1="112" x2="1775" y2="390" />
            <line x1="1820" y1="112" x2="1820" y2="390" />
            <line x1="1865" y1="112" x2="1865" y2="390" />
            <!-- Linha de circuito média direita -->
            <path d="M 1920 390 L 1660 390 L 1625 425 L 1490 425" stroke="#B8C5D4" stroke-width="1.8" />
            <path d="M 1920 390 L 1660 390 L 1625 425 L 1490 425" stroke="url(#hudPulseGrad)" stroke-width="2.6" class="pulse-path" />
            <!-- Pequenos traços de telemetria -->
            <rect x="1765" y="330" width="8" height="3" fill="#B8C5D4" stroke="none" />
            <rect x="1780" y="330" width="8" height="3" fill="#B8C5D4" stroke="none" />
            <rect x="1795" y="330" width="8" height="3" fill="#B8C5D4" stroke="none" />
        </g>

        <!-- CANTO INFERIOR ESQUERDO -->
        <g stroke="#CFD8E3" stroke-width="1.3" fill="none">
            <path d="M 38 1080 L 38 790 L 58 765 L 88 765 L 88 1080" stroke="#B8C5D4" stroke-width="1.6" />
            <line x1="38" y1="860" x2="245" y2="860" />
            <line x1="38" y1="915" x2="245" y2="915" />
            <line x1="38" y1="970" x2="245" y2="970" />
            <line x1="38" y1="1025" x2="245" y2="1025" />
            <line x1="140" y1="740" x2="140" y2="1080" />
            <line x1="192" y1="740" x2="192" y2="1080" />
            <path d="M 38 1080 L 38 790 L 58 765 L 88 765 L 88 1080" stroke="url(#hudPulseGrad)" stroke-width="2.5" class="pulse-path" />
        </g>

        <!-- CANTO INFERIOR DIREITO -->
        <g stroke="#CFD8E3" stroke-width="1.3" fill="none">
            <path d="M 1920 960 L 1710 960 L 1675 995 L 1480 995" stroke="#B8C5D4" stroke-width="1.6" />
            <path d="M 1920 960 L 1710 960 L 1675 995 L 1480 995" stroke="url(#hudPulseGrad)" stroke-width="2.5" class="pulse-path-delayed" />
        </g>
    </svg>

    <!-- DEFINIÇÕES DE GRADIENTES VETORIAIS OFICIAIS -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <!-- Gradiente Marca Principal RADAR (Ciano/Teal no topo -> Azul Marinho profundo na base) -->
            <linearGradient id="grad-main-radar" x1="25%" y1="5%" x2="65%" y2="95%">
                <stop offset="0%" stop-color="#1599B2" />
                <stop offset="48%" stop-color="#0A648F" />
                <stop offset="100%" stop-color="#092147" />
            </linearGradient>

            <!-- Gradiente Radar Clínico -->
            <linearGradient id="grad-clinico" x1="20%" y1="10%" x2="80%" y2="90%">
                <stop offset="0%" stop-color="#19B5D8" />
                <stop offset="100%" stop-color="#0E85A8" />
            </linearGradient>

            <!-- Gradiente Radar Beers -->
            <linearGradient id="grad-beers" x1="15%" y1="10%" x2="85%" y2="90%">
                <stop offset="0%" stop-color="#229B71" />
                <stop offset="55%" stop-color="#146E4E" />
                <stop offset="100%" stop-color="#0A3D2B" />
            </linearGradient>

            <!-- Gradiente Radar Oncológico -->
            <linearGradient id="grad-onco" x1="15%" y1="10%" x2="85%" y2="90%">
                <stop offset="0%" stop-color="#8B1E66" />
                <stop offset="60%" stop-color="#68104B" />
                <stop offset="100%" stop-color="#3E072C" />
            </linearGradient>

            <!-- Gradiente Radar UTI -->
            <linearGradient id="grad-uti" x1="20%" y1="8%" x2="80%" y2="92%">
                <stop offset="0%" stop-color="#F26918" />
                <stop offset="50%" stop-color="#E33619" />
                <stop offset="100%" stop-color="#B91116" />
            </linearGradient>
        </defs>
    </svg>

    <!-- CONTEÚDO PRINCIPAL EM TELA ÚNICA (100VH) -->
    <main class="relative z-10 w-full max-w-[1440px] h-full flex flex-col justify-between items-center px-6 py-6 md:py-10">

        <!-- Espaçador de equilíbrio superior -->
        <div class="h-1"></div>

        <!-- SEÇÃO SUPERIOR: MARCA PRINCIPAL RADAR (ÍCONE À ESQUERDA + TEXTO À DIREITA) -->
        <header class="flex flex-col items-center justify-center">
            <div class="interactive-logo flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 cursor-pointer">
                <!-- Símbolo Principal do Radar -->
                <div class="w-[150px] h-[150px] md:w-[195px] md:h-[195px] lg:w-[215px] lg:h-[215px] flex items-center justify-center">
                    <svg id="svg-main-radar" viewBox="0 0 200 200" class="w-full h-full overflow-visible"></svg>
                </div>

                <!-- Logotipo RADAR + Frase Institucional -->
                <div class="flex flex-col items-center md:items-start text-center md:text-left">
                    <h1 class="font-extrabold text-[#07213C] text-5xl sm:text-6xl md:text-[5.4rem] lg:text-[6.2rem] tracking-[0.03em] leading-none">
                        RADAR
                    </h1>
                    <p class="mt-2 md:mt-2.5 text-[#334E68] font-semibold text-[0.72rem] sm:text-xs md:text-sm tracking-[0.21em] uppercase">
                        Plataforma de Suporte à Decisão Clínica
                    </p>
                </div>
            </div>
        </header>

        <!-- SEÇÃO INFERIOR: TÍTULO "PROGRAMAS" + 5 MÓDULOS ALINHADOS EM LINHA -->
        <section class="w-full flex flex-col items-center">
            <h2 class="text-[#1A3350] text-xs md:text-[0.82rem] font-semibold tracking-[0.22em] uppercase mb-4 md:mb-6">
                PROGRAMAS
            </h2>

            <!-- Grade de 5 Colunas Lado a Lado -->
            <div class="w-full grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-5 items-start justify-items-center">

                <!-- 1. RADAR CLÍNICO -->
                <a href="https://radar-clinico.onrender.com/" target="_blank" rel="noopener noreferrer" class="program-card interactive-logo w-full max-w-[245px]">
                    <div class="w-[115px] h-[115px] md:w-[138px] md:h-[138px] lg:w-[148px] lg:h-[148px]">
                        <svg id="svg-clinico" viewBox="0 0 200 200" class="w-full h-full overflow-visible">
                            <g class="mesh-layer"></g>
                            <!-- Ícone ECG (Fiel à imagem: atravessa da esquerda, faz P-Q-R-S-T no centro e alinha à direita) -->
                            <g class="center-symbol">
                                <path d="M 30 104 L 74 104 L 83 84 L 93 128 L 103 63 L 114 137 L 123 82 L 131 104 L 160 104"
                                      fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
                                <path d="M 30 104 L 74 104 L 83 84 L 93 128 L 103 63 L 114 137 L 123 82 L 131 104 L 160 104"
                                      fill="none" stroke="url(#grad-clinico)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
                            </g>
                        </svg>
                    </div>
                    <div class="text-center mt-2">
                        <div class="title-radar text-[1.45rem] md:text-[1.7rem] lg:text-[1.85rem] text-[#104F6E]">RADAR</div>
                        <div class="subtitle-program text-[1.02rem] md:text-[1.15rem] text-[#104F6E]">CLÍNICO</div>
                    </div>
                </a>

                <!-- 2. RADAR BEERS -->
                <a href="https://radarbeersrb.onrender.com" target="_blank" rel="noopener noreferrer" class="program-card interactive-logo w-full max-w-[245px]">
                    <div class="w-[115px] h-[115px] md:w-[138px] md:h-[138px] lg:w-[148px] lg:h-[148px]">
                        <svg id="svg-beers" viewBox="0 0 200 200" class="w-full h-full overflow-visible">
                            <g class="mesh-layer"></g>
                            <!-- Cápsula Farmacêutica perfeitamente centralizada em (100,100) -->
                            <g class="center-symbol">
                                <g transform="translate(100, 100) rotate(-42)">
                                    <!-- Fundo branco na metade direita para destacar na malha -->
                                    <rect x="-32" y="-16.5" width="64" height="33" rx="16.5" fill="#F4F7F9" />
                                    <!-- Metade esquerda sólida (Verde Beers) -->
                                    <path d="M 0 -16.5 L -15.5 -16.5 A 16.5 16.5 0 0 0 -15.5 16.5 L 0 16.5 Z" fill="#157353" />
                                    <!-- Contorno da cápsula inteira -->
                                    <rect x="-32" y="-16.5" width="64" height="33" rx="16.5" fill="none" stroke="#126548" stroke-width="5.2" />
                                    <!-- Linha divisória central da cápsula -->
                                    <line x1="0" y1="-16.5" x2="0" y2="16.5" stroke="#126548" stroke-width="4" />
                                </g>
                            </g>
                        </svg>
                    </div>
                    <div class="text-center mt-2">
                        <div class="title-radar text-[1.45rem] md:text-[1.7rem] lg:text-[1.85rem] text-[#0E4D36]">RADAR</div>
                        <div class="subtitle-program text-[1.02rem] md:text-[1.15rem] text-[#0E4D36]">BEERS</div>
                    </div>
                </a>

                <!-- 3. RADAR ONCOLÓGICO -->
                <a href="https://oncologico.radarsaude.com.br" target="_blank" rel="noopener noreferrer" class="program-card interactive-logo w-full max-w-[245px]">
                    <div class="w-[115px] h-[115px] md:w-[138px] md:h-[138px] lg:w-[148px] lg:h-[148px]">
                        <svg id="svg-onco" viewBox="0 0 200 200" class="w-full h-full overflow-visible">
                            <g class="mesh-layer"></g>
                            <!-- Laço Oncológico proporcional e bem encaixado com o ponto superior interno -->
                            <g class="center-symbol">
                                <g transform="translate(100, 102) scale(0.92)">
                                    <!-- Halo branco sutil para separar as pontas inferiores da malha -->
                                    <path d="M 0 -46 C -24 -46, -30 -16, -14 10 L -32 45 L -17 42 L -14 54 L 0 28 L 14 54 L 17 42 L 32 45 L 14 10 C 30 -16, 24 -46, 0 -46 Z"
                                          fill="none" stroke="#F2F5F8" stroke-width="6" stroke-linejoin="round" />
                                    <!-- Perna esquerda/loop do laço -->
                                    <path d="M 0 -46 C -24 -46, -29 -16, -13 10 L 14 54 L 17 42 L 31 45 L 11 10 C -11 -16, -12 -32, 0 -32 C 12 -32, 11 -16, -11 10 L -31 45 L -17 42 L -14 54 L 13 10 C 29 -16, 24 -46, 0 -46 Z"
                                          fill="url(#grad-onco)" />
                                    <!-- Detalhe de dobra de profundidade nas pernas do laço -->
                                    <path d="M 0 12 L 13 33 L 5 46 L -6 24 Z" fill="#470932" opacity="0.55" />
                                    <!-- Ponto circular característico no interior superior do laço -->
                                    <circle cx="0" cy="-19" r="5.5" fill="#68104B" />
                                </g>
                            </g>
                        </svg>
                    </div>
                    <div class="text-center mt-2">
                        <div class="title-radar text-[1.45rem] md:text-[1.7rem] lg:text-[1.85rem] text-[#4B0B36]">RADAR</div>
                        <div class="subtitle-program text-[1.02rem] md:text-[1.15rem] text-[#4B0B36]">ONCOLÓGICO</div>
                    </div>
                </a>

                <!-- 4. RADAR PED (Azul Celeste + Rosa Suave + Pezinhos de Bebê Anatômicos) -->
                <a href="https://ped.radarsaude.com.br" target="_blank" rel="noopener noreferrer" class="program-card interactive-logo w-full max-w-[245px]">
                    <div class="w-[115px] h-[115px] md:w-[138px] md:h-[138px] lg:w-[148px] lg:h-[148px]">
                        <svg id="svg-ped" viewBox="0 0 200 200" class="w-full h-full overflow-visible">
                            <g class="mesh-layer"></g>
                            <!-- Dois Pezinhos de Bebê Anatômicos (Esquerdo Azul, Direito Rosa) -->
                            <g class="center-symbol">
                                <!-- Pé Esquerdo (Azul Bebê Vibrante) -->
                                <g transform="translate(83, 105) rotate(-13) scale(0.86)" fill="#42ACE0">
                                    <!-- Sola/Planta do pé com curvinha plantar interna e calcanhar arredondado -->
                                    <path d="M -11 -8
                                             C -17 -8, -19 4, -15 14
                                             C -12 22, -10 31, -2 32
                                             C 6 33, 11 26, 10 17
                                             C 9 9, 11 2, 13 -4
                                             C 15 -11, 8 -16, -1 -14
                                             C -6 -13, -8 -8, -11 -8 Z" />
                                    <!-- 5 Dedinhos do pé esquerdo (do dedão à direita ao mindinho à esquerda) -->
                                    <ellipse cx="10.5" cy="-21.5" rx="4.6" ry="5.6" transform="rotate(8 10.5 -21.5)" />
                                    <ellipse cx="1.5" cy="-22.5" rx="3.4" ry="4.3" transform="rotate(2 1.5 -22.5)" />
                                    <ellipse cx="-6" cy="-20.5" rx="2.9" ry="3.7" transform="rotate(-6 -6 -20.5)" />
                                    <ellipse cx="-12.2" cy="-16.8" rx="2.5" ry="3.2" transform="rotate(-14 -12.2 -16.8)" />
                                    <ellipse cx="-17" cy="-11.5" rx="2.1" ry="2.7" transform="rotate(-24 -17 -11.5)" />
                                </g>

                                <!-- Pé Direito (Rosa Coral Suave) -->
                                <g transform="translate(117, 105) rotate(13) scale(0.86)" fill="#F28291">
                                    <!-- Sola/Planta do pé direito espelhada -->
                                    <path d="M 11 -8
                                             C 17 -8, 19 4, 15 14
                                             C 12 22, 10 31, 2 32
                                             C -6 33, -11 26, -10 17
                                             C -9 9, -11 2, -13 -4
                                             C -15 -11, -8 -16, 1 -14
                                             C 6 -13, 8 -8, 11 -8 Z" />
                                    <!-- 5 Dedinhos do pé direito (do dedão à esquerda ao mindinho à direita) -->
                                    <ellipse cx="-10.5" cy="-21.5" rx="4.6" ry="5.6" transform="rotate(-8 -10.5 -21.5)" />
                                    <ellipse cx="-1.5" cy="-22.5" rx="3.4" ry="4.3" transform="rotate(-2 -1.5 -22.5)" />
                                    <ellipse cx="6" cy="-20.5" rx="2.9" ry="3.7" transform="rotate(6 6 -20.5)" />
                                    <ellipse cx="12.2" cy="-16.8" rx="2.5" ry="3.2" transform="rotate(14 12.2 -16.8)" />
                                    <ellipse cx="17" cy="-11.5" rx="2.1" ry="2.7" transform="rotate(24 17 -11.5)" />
                                </g>
                            </g>
                        </svg>
                    </div>
                    <div class="text-center mt-2">
                        <div class="title-radar text-[1.45rem] md:text-[1.7rem] lg:text-[1.85rem] text-[#07213C]">RADAR</div>
                        <div class="subtitle-program text-[1.02rem] md:text-[1.15rem] text-[#F28291]">PED</div>
                    </div>
                </a>

                <!-- 5. RADAR UTI -->
                <a href="https://uti.radarsaude.com.br" target="_blank" rel="noopener noreferrer" class="program-card interactive-logo w-full max-w-[245px] col-span-2 sm:col-span-1">
                    <div class="w-[115px] h-[115px] md:w-[138px] md:h-[138px] lg:w-[148px] lg:h-[148px]">
                        <svg id="svg-uti" viewBox="0 0 200 200" class="w-full h-full overflow-visible">
                            <g class="mesh-layer"></g>
                            <!-- Monitor Multiparamétrico UTI com Coração e Linha de ECG -->
                            <g class="center-symbol">
                                <!-- Antena/Sensor superior do monitor -->
                                <line x1="100" y1="61" x2="100" y2="72" stroke="#D9231A" stroke-width="4.5" stroke-linecap="round" />
                                <!-- Moldura do monitor -->
                                <rect x="65" y="72" width="70" height="54" rx="8" fill="#F2F5F8" stroke="url(#grad-uti)" stroke-width="5.5" />
                                <!-- Coração centralizado à direita na tela do monitor -->
                                <path d="M 107 95
                                         C 107 89, 98 86, 98 94
                                         C 98 86, 89 89, 89 95
                                         C 89 103, 98 108, 98 113
                                         C 98 108, 107 103, 107 95 Z"
                                      fill="#D9231A" transform="translate(8, -1) scale(1.08)" />
                                <!-- Linha de batimento cardíaco atravessando a tela e o coração -->
                                <path d="M 71 99 L 81 99 L 85 88 L 90 109 L 94 96 L 101 99 L 104 94 L 108 104 L 112 97 L 128 97"
                                      fill="none" stroke="#D9231A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                                <!-- Indicadores inferiores do monitor -->

    <!-- GERADOR MATEMÁTICO DA MALHA POLAR DE RADAR E PARTÍCULAS DISPERSAS -->
    <script>
        const SVG_NS = "http://www.w3.org/2000/svg";

        /**
         * Converte coordenadas polares (em graus, onde 0° = direita / 3 horas) para cartesianas
         */
        function polarToCartesian(cx, cy, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees * Math.PI) / 180.0;
            return {
                x: cx + radius * Math.cos(angleInRadians),
                y: cy + radius * Math.sin(angleInRadians)
            };
        }

        /**
         * Gera o caminho SVG (path d) de uma célula anelar (bloco curvo do radar)
         */
        function createAnnularSectorPath(cx, cy, rInner, rOuter, startAngle, endAngle) {
            const p1 = polarToCartesian(cx, cy, rOuter, startAngle);
            const p2 = polarToCartesian(cx, cy, rOuter, endAngle);
            const p3 = polarToCartesian(cx, cy, rInner, endAngle);
            const p4 = polarToCartesian(cx, cy, rInner, startAngle);
            const largeArc = Math.abs(endAngle - startAngle) > 180 ? 1 : 0;

            return [
                `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
                `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`,
                `L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
                `A ${rInner} ${rInner} 0 ${largeArc} 0 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)}`,
                "Z"
            ].join(" ");
        }

        /**
         * Constrói a malha de radar em formato "C" + partículas de dispersão à esquerda
         */
        function buildRadarMesh(targetSvgSelector, options) {
            const svg = document.querySelector(targetSvgSelector);
            if (!svg) return;
            const container = svg.querySelector(".mesh-layer") || svg;

            const cx = 104;
            const cy = 100;
            const rings = options.rings;
            const totalSlots = options.totalSlots || 24;
            const angleGap = options.angleGap || 2.3;
            const stepAngle = 360 / totalSlots;

            rings.forEach((ring, ringIdx) => {
                for (let s = 0; s < totalSlots; s++) {
                    // Centraliza o slot 0 na direita (0 graus)
                    let centerAngle = s * stepAngle;
                    if (centerAngle > 180) centerAngle -= 360; // Intervalo [-180, 180]

                    const absAngle = Math.abs(centerAngle);

                    // Abertura na esquerda (em torno de 180° / -180°)
                    if (absAngle > ring.maxAngle) continue;

                    const a1 = centerAngle - (stepAngle - angleGap) / 2;
                    const a2 = centerAngle + (stepAngle - angleGap) / 2;

                    const path = document.createElementNS(SVG_NS, "path");
                    path.setAttribute("d", createAnnularSectorPath(cx, cy, ring.rIn, ring.rOut, a1, a2));
                    path.setAttribute("class", "radar-cell");

                    // Cor específica (suporta função customizada para o Radar Ped ou gradiente único)
                    const fillValue = typeof options.fillFn === "function"
                        ? options.fillFn(centerAngle, ringIdx, s)
                        : options.fill;
                    path.setAttribute("fill", fillValue);

                    // Vetores suaves para animação orgânica ao passar o mouse (hover)
                    const rad = (centerAngle * Math.PI) / 180;
                    const distanceFactor = (ringIdx + 1) * 1.9 + ((s % 3) * 0.8);
                    const dx = (Math.cos(rad) * distanceFactor).toFixed(2);
                    const dy = (Math.sin(rad) * distanceFactor).toFixed(2);
                    path.style.setProperty("--dx", `${dx}px`);
                    path.style.setProperty("--dy", `${dy}px`);
                    path.style.setProperty("--sc", (1.02 + (ringIdx * 0.015)).toFixed(3));

                    container.appendChild(path);
                }
            });

            // Adiciona os quadradinhos dispersos na abertura esquerda (efeito de desintegração digital)
            if (options.particles && options.particles.length) {
                options.particles.forEach((pt, i) => {
                    const pos = polarToCartesian(cx, cy, pt.r, pt.angle);
                    const rect = document.createElementNS(SVG_NS, "rect");
                    const half = pt.size / 2;

                    rect.setAttribute("x", (pos.x - half).toFixed(2));
                    rect.setAttribute("y", (pos.y - half).toFixed(2));
                    rect.setAttribute("width", pt.size);
                    rect.setAttribute("height", pt.size);
                    rect.setAttribute("rx", "0.8");
                    rect.setAttribute("class", "radar-particle");

                    const fillValue = typeof options.fillFn === "function"
                        ? options.fillFn(pt.angle, 0, i)
                        : options.fill;
                    rect.setAttribute("fill", fillValue);

                    // Rotação base alinhada com o feixe do radar
                    const baseRot = pt.rot !== undefined ? pt.rot : pt.angle * 0.35;
                    rect.setAttribute("transform", `rotate(${baseRot.toFixed(1)} ${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);

                    // Movimento leve e elástico no hover
                    const rad = (pt.angle * Math.PI) / 180;
                    const px = (Math.cos(rad) * (4.5 + (i % 4) * 1.8)).toFixed(2);
                    const py = (Math.sin(rad) * (4.5 + (i % 3) * 1.6)).toFixed(2);
                    const pr = ((i % 2 === 0 ? 1 : -1) * (10 + (i % 4) * 4)).toFixed(1);

                    rect.style.setProperty("--px", `${px}px`);
                    rect.style.setProperty("--py", `${py}px`);
                    rect.style.setProperty("--pr", `${pr}deg`);

                    container.appendChild(rect);
                });
            }
        }

        // Coordenadas Polares Padrão das Partículas na Abertura Esquerda (Fiel à imagem de referência)
        const standardLeftParticles = [
            // Arco superior esquerdo (-115° a -168°)
            { r: 81, angle: -126, size: 7.2 },

            { r: 84, angle: -154, size: 5.0 },
            { r: 71, angle: -154, size: 4.4 },
            { r: 94, angle: -149, size: 3.8 },
            { r: 86, angle: -168, size: 4.0 },
            { r: 73, angle: -169, size: 3.5 },
            // Arco inferior esquerdo (+115° a +168°)
            { r: 81, angle: 126, size: 7.2 },
            { r: 67, angle: 124, size: 6.2 },
            { r: 54, angle: 128, size: 5.2 },
            { r: 82, angle: 140, size: 6.0 },
            { r: 69, angle: 139, size: 5.4 },
            { r: 56, angle: 143, size: 4.5 },
            { r: 92, angle: 135, size: 4.5 },
            { r: 84, angle: 154, size: 5.0 },
            { r: 71, angle: 154, size: 4.4 },
            { r: 94, angle: 149, size: 3.8 },
            { r: 86, angle: 168, size: 4.0 },
            { r: 73, angle: 169, size: 3.5 }
        ];

        // 1. Constrói a Marca Principal RADAR (4 anéis densos + partículas na esquerda)
        buildRadarMesh("#svg-main-radar", {
            totalSlots: 24,
            angleGap: 2.2,
            fill: "url(#grad-main-radar)",
            rings: [
                { rIn: 44, rOut: 53, maxAngle: 112 },
                { rIn: 56, rOut: 66, maxAngle: 118 },
                { rIn: 69, rOut: 80, maxAngle: 124 },
                { rIn: 83, rOut: 96, maxAngle: 116 }
            ],
            particles: [
                { r: 89, angle: -127, size: 9.0 },
                { r: 74, angle: -134, size: 7.2 },
                { r: 61, angle: -130, size: 6.0 },
                { r: 48, angle: -125, size: 5.0 },
                { r: 88, angle: -143, size: 6.8 },
                { r: 74, angle: -149, size: 5.6 },
                { r: 60, angle: -146, size: 4.8 },
                { r: 86, angle: -159, size: 5.2 },
                { r: 92, angle: -172, size: 4.2 },
                { r: 89, angle: 127, size: 9.0 },
                { r: 74, angle: 134, size: 7.2 },
                { r: 61, angle: 130, size: 6.0 },
                { r: 48, angle: 125, size: 5.0 },
                { r: 88, angle: 143, size: 6.8 },
                { r: 74, angle: 149, size: 5.6 },
                { r: 60, angle: 146, size: 4.8 },
                { r: 86, angle: 159, size: 5.2 },
                { r: 92, angle: 172, size: 4.2 }
            ]
        });

        // Configuração dos 3 anéis padrão para os 5 Programas
        const programRings = [
            { rIn: 48, rOut: 58, maxAngle: 115 },
            { rIn: 61, rOut: 72, maxAngle: 118 },
            { rIn: 75, rOut: 88, maxAngle: 115 }
        ];

        // 2. Constrói RADAR CLÍNICO
        buildRadarMesh("#svg-clinico", {
            totalSlots: 24,
            angleGap: 2.3,
            fill: "url(#grad-clinico)",
            rings: programRings,
            particles: standardLeftParticles
        });

        // 3. Constrói RADAR BEERS
        buildRadarMesh("#svg-beers", {
            totalSlots: 24,
            angleGap: 2.3,
            fill: "url(#grad-beers)",
            rings: programRings,
            particles: standardLeftParticles
        });

        // 4. Constrói RADAR ONCOLÓGICO
        buildRadarMesh("#svg-onco", {
            totalSlots: 24,

            rings: programRings,
            particles: standardLeftParticles
        });

        // 5. Constrói RADAR PED (Malha Bicolor: Azul Celeste e Rosa Suave  seconforme imagem original aprovada)
        buildRadarMesh("#svg-ped", {
            totalSlots: 24,
            angleGap: 2.3,
            rings: programRings,
            particles: standardLeftParticles,
            fillFn: function(angle, ringIdx) {
                // Mescla harmônica de blocos Azul Celeste (#42ACE0) e Rosa Suave (#F28291) igual à imagem aprovada
                if (angle < -95) return "#42ACE0"; // Topo esquerdo azul
                if (angle >= -95 && angle < -35) return ringIdx === 2 ? "#F28291" : "#56B4E3"; // Topo com toque rosa externo
                if (angle >= -35 && angle <= 25) return "#42ACE0"; // Direita superior azul
                if (angle > 25 && angle <= 95) return ringIdx === 0 ? "#42ACE0" : "#F28291"; // Direita inferior rosa com anel interno azul
                return "#F28291"; // Base e dispersão inferior rosa
            }
        });

        // 6. Constrói RADAR UTI
        buildRadarMesh("#svg-uti", {
            totalSlots: 24,
            angleGap: 2.3,
            fill: "url(#grad-uti)",
            rings: programRings,
            particles: standardLeftParticles
        });
    </script>
